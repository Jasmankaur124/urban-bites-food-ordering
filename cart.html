<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Urban Bites</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav>
  <a href="index.html">Home</a>
  <a href="menu.html">Menu</a>
  <a href="cart.html" class="active">Cart 🛒</a>
</nav>

<!-- CART SECTION -->
<section class="cart-container">

  <h1>🛒 Your Cart</h1>

  <!-- CART ITEMS -->
  <div id="cartItems"></div>

  <!-- SUMMARY -->
  <div class="cart-summary">
    <h2>Total: ₹<span id="total">0</span></h2>

    <button onclick="clearCart()" class="clear-btn">
      Clear Cart
    </button>

    <!-- ONLY ONE BUTTON -->
    <button onclick="showPayment()" class="order-btn">
      Proceed to Payment
    </button>
  </div>

  <!-- PAYMENT SECTION -->
  <div id="paymentSection" style="display:none; margin-top:30px;">

    <h3>Select Payment Method</h3>

    <div class="payment-options">
      <label>
        <input type="radio" name="pay" value="upi" checked> UPI
      </label>

      <label>
        <input type="radio" name="pay" value="card"> Card
      </label>
    </div>

    <!-- UPI BOX -->
    <div id="upiBox" class="payment-box">

      <h4>Pay via UPI</h4>

      <input type="text" id="upiInput" placeholder="Enter UPI ID (example@upi)">

      <div class="upi-apps">
        <button type="button" class="upi-btn">GPay</button>
        <button type="button" class="upi-btn">PhonePe</button>
        <button type="button" class="upi-btn">Paytm</button>
      </div>

      <p class="upi-note">💡 You will be redirected to your UPI app</p>

    </div>

    <!-- CARD BOX -->
    <div id="cardBox" class="payment-box" style="display:none;">
      <h4>Pay via Card</h4>

      <input type="text" placeholder="Card Number">
      <input type="text" placeholder="Expiry (MM/YY)">
      <input type="text" placeholder="CVV">
    </div>

    <!-- FINAL BUTTON -->
    <button onclick="placeOrder()" class="order-btn">
      Place Order ✅
    </button>

  </div>

</section>

<!-- JS FILE -->



<script>
function loadCart() {
  const container = document.getElementById("cartItems");
  const totalElement = document.getElementById("total");
  const paymentSection = document.getElementById("paymentSection");

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = `
      <p style="text-align:center; font-size:18px; color:#777;">
        Your cart is empty 😢
      </p>
    `;
    totalElement.innerText = 0;
    paymentSection.style.display = "none";
    return;
  }

  let total = 0;

  cart.forEach((item, index) => {
    total += item.price * item.quantity;

    container.innerHTML += `
      <div class="cart-item">
        <div>
          <h3>${item.name}</h3>
          <p>₹${item.price} × ${item.quantity}</p>
        </div>

        <div class="cart-controls">
          <button onclick="changeQty(${index}, -1)">➖</button>
          <span>${item.quantity}</span>
          <button onclick="changeQty(${index}, 1)">➕</button>
        </div>

        <button onclick="removeItem(${index})">❌</button>
      </div>
    `;
  });

  totalElement.innerText = total;
}

function changeQty(index, change) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if (!cart[index]) return;

  cart[index].quantity += change;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.splice(index, 1);

  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function clearCart() {
  localStorage.removeItem("cart");
  loadCart();
}

function showPayment() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if (cart.length === 0) {
    alert("Your cart is empty 😢");
    return;
  }

  const paymentSection = document.getElementById("paymentSection");
  paymentSection.style.display = "block";

  paymentSection.scrollIntoView({
    behavior: "smooth"
  });
}

function placeOrder() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if (cart.length === 0) {
    alert("Cart is empty 😢");
    return;
  }

  const selectedPayment = document.querySelector('input[name="pay"]:checked').value;

  if (selectedPayment === "upi") {
    const upiId = document.getElementById("upiInput").value.trim();

    if (upiId === "") {
      alert("Please enter UPI ID");
      return;
    }
  }

  localStorage.removeItem("cart");

  showCustomPopup("🎉 Order placed successfully!");

  window.location.href = "success.html";
}
function showCustomPopup(message) {
  document.getElementById("popupMessage").innerText = message;
  document.getElementById("customPopup").style.display = "flex";
}

function closePopup() {
  document.getElementById("customPopup").style.display = "none";
  window.location.href = "success.html";
}

document.addEventListener("DOMContentLoaded", function () {
  loadCart();

  const paymentOptions = document.querySelectorAll('input[name="pay"]');

  paymentOptions.forEach(option => {
    option.addEventListener("change", function () {
      const upiBox = document.getElementById("upiBox");
      const cardBox = document.getElementById("cardBox");

      if (this.value === "upi") {
        upiBox.style.display = "block";
        cardBox.style.display = "none";
      } else {
        upiBox.style.display = "none";
        cardBox.style.display = "block";
      }
    });
  });
});
</script>

<div id="customPopup" class="custom-popup" style="display:none;">
  <div class="popup-box">
    <h2>🎉 Success!</h2>
    <p id="popupMessage"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
  if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
  }
</script>




</body>
</html>
